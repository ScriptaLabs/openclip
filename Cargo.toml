[workspace]
members = [
  "crates/openclip-buffer",
  "crates/openclip-capture",
  "crates/openclip-core",
  "crates/openclip-cs2",
  "crates/openclip-storage",
  "app/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/openclip/openclip"

[workspace.dependencies]
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }
mp4io = "0.1.2"
nvenc = "0.1.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[workspace.dependencies.windows-capture]
version = "2.0.1"

[workspace.dependencies.wasapi]
version = "0.24.0"

[workspace.lints.rust]
# Low-level platform backends may opt into narrowly documented unsafe operations.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
