[package]
name = "openclip-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openclip_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openclip-core = { path = "../../crates/openclip-core" }
openclip-buffer = { path = "../../crates/openclip-buffer" }
openclip-capture = { path = "../../crates/openclip-capture" }
openclip-cs2 = { path = "../../crates/openclip-cs2" }
openclip-storage = { path = "../../crates/openclip-storage" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
